<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="50%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#180505"/>
    </linearGradient>
    <radialGradient id="redGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#cc0000" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#cc0000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="redBtnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b30000"/>
      <stop offset="100%" stop-color="#e60000"/>
    </linearGradient>
    <linearGradient id="darkBtnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1c1c1c"/>
      <stop offset="100%" stop-color="#2a2a2a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Fondo base -->
  <rect width="1000" height="340" fill="url(#bgGrad)"/>
  <rect width="1000" height="340" fill="url(#redGlow)"/>

  <!-- Trama técnica / industrial sutil -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="40" x2="1000" y2="40"/>
    <line x1="0" y1="300" x2="1000" y2="300"/>
    <line x1="120" y1="0" x2="120" y2="340"/>
    <line x1="880" y1="0" x2="880" y2="340"/>
  </g>

  <!-- Borde contenedor táctico con esquinas angulares -->
  <polygon points="20,20 980,20 980,300 960,320 20,320" fill="none" stroke="#333333" stroke-width="2"/>
  <polygon points="20,20 980,20 980,26 26,26 20,32" fill="#cc0000"/>
  <rect x="20" y="316" width="60" height="4" fill="#cc0000"/>
  <rect x="920" y="316" width="40" height="4" fill="#cc0000"/>

  <!-- Icono Biohazard Vectorizado -->
  <g transform="translate(60, 48)" filter="url(#shadow)">
    <!-- Círculo base oscuro -->
    <rect x="0" y="0" width="76" height="76" rx="8" fill="#141414" stroke="#cc0000" stroke-width="2"/>
    <!-- Biohazard Symbol Paths -->
    <g transform="translate(38, 38) scale(0.68)" fill="#cc0000">
      <circle cx="0" cy="0" r="10" fill="#141414" stroke="#cc0000" stroke-width="5"/>
      <path d="M 0,-34 A 20,20 0 0,0 -16,-22 A 28,28 0 0,1 0,-6 A 28,28 0 0,1 16,-22 A 20,20 0 0,0 0,-34 Z"/>
      <path d="M -29.4,17 A 20,20 0 0,0 -11,25 A 28,28 0 0,1 -5.2,0 A 28,28 0 0,1 -27,-3 A 20,20 0 0,0 -29.4,17 Z"/>
      <path d="M 29.4,17 A 20,20 0 0,0 27,-3 A 28,28 0 0,1 5.2,0 A 28,28 0 0,1 11,25 A 20,20 0 0,0 29.4,17 Z"/>
      <circle cx="0" cy="0" r="4.5" fill="#cc0000"/>
    </g>
  </g>

  <!-- Tag superior de estado -->
  <g transform="translate(155, 52)">
    <rect x="0" y="0" width="180" height="22" rx="3" fill="#1f1111" stroke="#cc0000" stroke-width="1"/>
    <text x="10" y="15" font-family="'Segoe UI', Roboto, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#ff4444" letter-spacing="1.5">
      ● WEB OFICIAL EN LÍNEA
    </text>
  </g>

  <!-- Marca y versión -->
  <text x="345" y="68" font-family="'Segoe UI', Roboto, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#888888" letter-spacing="2">
    MODS4VERSUS v1.2.2 • LEFT 4 DEAD 2
  </text>

  <!-- Titular principal de impacto -->
  <text x="155" y="112" font-family="Impact, 'Arial Black', -apple-system, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="1.5" filter="url(#shadow)">
    ¡MODS4VERSUS YA TIENE PÁGINA WEB OFICIAL!
  </text>

  <!-- Subtítulo / Descripción -->
  <text x="155" y="146" font-family="'Segoe UI', Roboto, -apple-system, sans-serif" font-size="16" fill="#cccccc" font-weight="400">
    El centro definitivo para descargar la última versión, consultar guías y jugar mods en Versus.
  </text>

  <!-- Línea divisoria roja -->
  <line x1="155" y1="172" x2="880" y2="172" stroke="#333333" stroke-width="1"/>
  <rect x="155" y="171" width="120" height="3" fill="#cc0000"/>

  <!-- BOTONES DE ACCIÓN VISUALES -->
  <!-- Botón 1 (Principal - Descargar) -->
  <g transform="translate(155, 202)" filter="url(#shadow)">
    <!-- Chamfered polygon button -->
    <polygon points="0,0 350,0 370,22 370,56 0,56" fill="url(#redBtnGrad)"/>
    <!-- Icono de descarga (flecha hacia abajo) -->
    <g transform="translate(24, 18)" fill="#ffffff">
      <path d="M10 2 v12 M5 9 l5 5 l5 -5 M2 18 h16" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
    <text x="56" y="35" font-family="Impact, 'Arial Black', sans-serif" font-size="20" font-weight="bold" fill="#ffffff" letter-spacing="1.5">
      DESCARGAR MODS4VERSUS
    </text>
    <text x="312" y="33" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#ffcccc" letter-spacing="0.5">
      v1.2.2
    </text>
  </g>

  <!-- Botón 2 (Secundario - Visitar Web) -->
  <g transform="translate(555, 202)" filter="url(#shadow)">
    <polygon points="0,0 340,0 360,22 360,56 0,56" fill="url(#darkBtnGrad)" stroke="#444444" stroke-width="1.5"/>
    <!-- Icono de globo terráqueo / web -->
    <g transform="translate(24, 18)" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round">
      <circle cx="10" cy="10" r="9"/>
      <ellipse cx="10" cy="10" rx="4.5" ry="9"/>
      <line x1="1" y1="10" x2="19" y2="10"/>
    </g>
    <text x="54" y="35" font-family="Impact, 'Arial Black', sans-serif" font-size="19" font-weight="bold" fill="#ffffff" letter-spacing="1">
      VISITAR PÁGINA WEB OFICIAL
    </text>
  </g>

  <!-- Indicador inferior de URL -->
  <text x="155" y="290" font-family="'Courier New', Courier, monospace" font-size="13" font-weight="bold" fill="#7FBA00" letter-spacing="1">
    ➜ https://mods4versus.pages.dev/
  </text>
  <text x="470" y="290" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#777777">
    • Instalador nativo para Windows 10 / 11 (64-bit) • 100% Libre y Seguro
  </text>
</svg>
